name: test-project
on: push # this is applicable to entire workflow consisting of multiple jobs
jobs:
  test: # job 1
    runs-on: ubuntu-latest
    steps:
    - name: Get code
      uses: actions/checkout@v4
    - name: Node js installation
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm test

  deploy: # job 
  continue-on-error : true # this is applicable to job level, deploy job will not run if test job fails
    needs: test # this is applicable to job level, deploy job will run only after successful completion of test job
    runs-on: ubuntu-latest
    steps:
    - name: Get code
      uses: actions/checkout@v4
    - name: Node js installation
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: build-project
      run: npm run build
    - name: deploy
      run: echo "deploying"